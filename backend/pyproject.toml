[project]
name = "backend"
version = "0.1.0"
description = "YouTube summarizer backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.165.0",
    "kokoro-onnx>=0.6.1",
    "misaki[en,zh]>=0.9.4",
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.10.26",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
